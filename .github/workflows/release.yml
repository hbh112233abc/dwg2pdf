name: Release

# 发布 GitHub Release 时自动构建多平台产物：
#   - Python wheels（maturin，多平台）
#   - 源码包 sdist
#   - 各平台 CLI 可执行文件
# 全部作为附件上传到该 Release，并把 wheels + sdist 发布到 PyPI。
#
# 触发方式（二选一即可，同一 tag 同时命中时由 concurrency 合并）：
#   1) 推送 tag（形如 0.1.3）：git push origin 0.1.3 —— 推荐，全自动
#   2) 在 GitHub 网页上发布 Release（兼容原来的手动流程）
#
# 需要配置的 secret：PYPI_API_TOKEN（PyPI 的 API Token）。
on:
  push:
    tags:
      - "*.*.*"
  release:
    types: [published]

# 推 tag 会同时产生 push 与 release(published) 两个事件，归到同一组避免重复构建
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: dwg2pdf

jobs:
  # ---------------------------------------------------------------------------
  # 先创建 Release：后续 job 只负责往里追加产物
  # （多个 action 都会「没有就创建」，并发创建会互相冲突，这里统一收口）
  # ---------------------------------------------------------------------------
  create-release:
    name: create release
    runs-on: ubuntu-latest
    steps:
      # gh release 需要仓库上下文：这个 job 没有 checkout，必须显式给 GH_REPO
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes

  # ---------------------------------------------------------------------------
  # Python wheels（maturin）
  # ---------------------------------------------------------------------------
  wheels:
    name: wheels / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: [create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: manylinux2014 }
          - { os: ubuntu-latest, target: aarch64, manylinux: manylinux2014 }
          - { os: macos-latest, target: x86_64 }
          - { os: macos-latest, target: aarch64 }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 源码包 sdist（pip 可基于源码构建）
  # ---------------------------------------------------------------------------
  sdist:
    name: sdist
    runs-on: ubuntu-latest
    needs: [create-release]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 各平台 CLI 可执行文件
  # 说明：Linux 使用 musl 静态链接；aarch64 由 ubuntu-latest 交叉编译。
  # ---------------------------------------------------------------------------
  cli:
    name: cli / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: [create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # 构建并直接上传压缩包（含 sha256）到当前 Release
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: ${{ env.BIN_NAME }}
          target: ${{ matrix.target }}
          archive: ${{ env.BIN_NAME }}-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 汇总 wheels + sdist 上传到 Release（CLI 已由上面的 action 直接上传）
  # ---------------------------------------------------------------------------
  publish:
    name: publish assets
    needs: [create-release, wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # push tag 触发时没有 github.event.release，统一用 ref_name（两种事件下都是 tag 名）
          tag_name: ${{ github.ref_name }}

  # ---------------------------------------------------------------------------
  # 发布到 PyPI（wheels + sdist）
  # 使用仓库 secret：PYPI_API_TOKEN
  # ---------------------------------------------------------------------------
  pypi:
    name: publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dwg2pdf
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
