name: Release

# 发布 GitHub Release 时自动构建多平台产物：
#   - Python wheels（maturin，多平台）
#   - 源码包 sdist
#   - 各平台 CLI 可执行文件
# 全部作为附件上传到该 Release，并把 wheels + sdist 发布到 PyPI。
#
# 版本号以 tag 为准：各构建 job 在 checkout 后调用 .github/actions/sync-version
# 把 Cargo.toml / pyproject.toml / Cargo.lock 的 version 改成 tag 名，因此发版无需
# 手动改版本号；发布成功后 commit-back job 再把这份版本号提交回 main，使仓库不滞后。
#
# 触发方式（二选一即可，同一 tag 同时命中时由 concurrency 合并）：
#   1) 推送 tag（形如 0.1.3）：git push origin 0.1.3 —— 推荐，全自动
#   2) 在 GitHub 网页上发布 Release（兼容原来的手动流程）
#
# 需要配置的 secret：PYPI_API_TOKEN（PyPI 的 API Token）。
on:
  push:
    tags:
      - "*.*.*"
  release:
    types: [published]

# 推 tag 会同时产生 push 与 release(published) 两个事件，归到同一组避免重复构建
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: dwg2pdf

jobs:
  # ---------------------------------------------------------------------------
  # 先创建 Release：后续 job 只负责往里追加产物
  # （多个 action 都会「没有就创建」，并发创建会互相冲突，这里统一收口）
  # ---------------------------------------------------------------------------
  create-release:
    name: create release
    runs-on: ubuntu-latest
    steps:
      # gh release 需要仓库上下文：这个 job 没有 checkout，必须显式给 GH_REPO
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes

  # ---------------------------------------------------------------------------
  # Python wheels（maturin）
  # ---------------------------------------------------------------------------
  wheels:
    name: wheels / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: [create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: manylinux2014 }
          - { os: ubuntu-latest, target: aarch64, manylinux: manylinux2014 }
          - { os: macos-latest, target: x86_64 }
          - { os: macos-latest, target: aarch64 }
          - { os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/sync-version
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 源码包 sdist（pip 可基于源码构建）
  # ---------------------------------------------------------------------------
  sdist:
    name: sdist
    runs-on: ubuntu-latest
    needs: [create-release]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/sync-version
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 各平台 CLI 可执行文件
  # 说明：Linux 使用 musl 静态链接；aarch64 由 ubuntu-latest 交叉编译。
  # ---------------------------------------------------------------------------
  cli:
    name: cli / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: [create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/sync-version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # 构建并直接上传压缩包（含 sha256）到当前 Release
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: ${{ env.BIN_NAME }}
          target: ${{ matrix.target }}
          archive: ${{ env.BIN_NAME }}-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 汇总 wheels + sdist 上传到 Release（CLI 已由上面的 action 直接上传）
  # ---------------------------------------------------------------------------
  publish:
    name: publish assets
    needs: [create-release, wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # push tag 触发时没有 github.event.release，统一用 ref_name（两种事件下都是 tag 名）
          tag_name: ${{ github.ref_name }}

  # ---------------------------------------------------------------------------
  # 发布到 PyPI（wheels + sdist）
  # 使用仓库 secret：PYPI_API_TOKEN
  # ---------------------------------------------------------------------------
  pypi:
    name: publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dwg2pdf
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

  # ---------------------------------------------------------------------------
  # 发布成功后把版本号回写到 main，使仓库中的 Cargo.toml / pyproject.toml /
  # Cargo.lock 与已发布的 tag 对齐（否则仓库里的版本号会一直滞后于 tag）。
  #
  # 仅当 tag 正好指向 main 顶端时才回写：这样是在 tag 内容之上追加一个纯版本号提交，
  # 不会覆盖 main 上可能更新的版本号。
  # 注：GITHUB_TOKEN 的推送不会再触发 workflow（GitHub 会忽略），不会形成回环。
  # ---------------------------------------------------------------------------
  commit-back:
    name: sync version to main
    needs: [publish, pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: 判断 tag 是否指向 main 顶端
        id: guard
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          tag_sha=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          main_sha=$(git rev-parse HEAD)
          echo "tag ${GITHUB_REF_NAME} -> ${tag_sha}"
          echo "main HEAD  -> ${main_sha}"
          if [ "$tag_sha" != "$main_sha" ]; then
            echo "::notice::tag 未指向 main 顶端，跳过版本号回写"
            echo "skip=true" >>"$GITHUB_OUTPUT"
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.skip == 'false'
        uses: ./.github/actions/sync-version
      - name: 提交并推送
        if: steps.guard.outputs.skip == 'false'
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "版本号已一致，无需提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml pyproject.toml Cargo.lock
          git commit -m "chore: 同步版本号至 ${GITHUB_REF_NAME}"
          if ! git push origin HEAD:main; then
            echo "::warning::回写 main 失败（可能受分支保护限制）；产物已正常发布，仓库版本号暂未同步，可手动执行同样的改动"
            exit 0
          fi
          echo "已回写版本号 ${GITHUB_REF_NAME} 到 main"
